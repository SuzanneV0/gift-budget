<!doctype html>
<!-- Source for apple-touch-icon.png and the app icons. ?size=N sets the icon size
     in pixels (laid out from the top-left, because headless Chrome has a minimum
     window width); ?maskable keeps the logo inside Android's safe zone (the
     central 80% circle). Regenerate with scripts/render-images.sh -->
<html><head><meta charset="utf-8"><style>
  * { margin: 0; }
  body { background: #faf8fd; overflow: hidden; }
  .tile { display: grid; place-items: center; background: #faf8fd; }
</style></head>
<body><div class="tile"><img src="../icon.svg" alt=""></div>
<script>
  var q = new URLSearchParams(location.search);
  var size = Number(q.get('size')) || 180;
  var scale = q.has('maskable') ? 0.56 : 0.73;
  var tile = document.querySelector('.tile');
  var img = document.querySelector('img');
  tile.style.width = tile.style.height = size + 'px';
  img.width = img.height = Math.round(size * scale);
</script>
</body></html>
