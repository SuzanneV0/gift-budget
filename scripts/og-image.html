<!doctype html>
<!-- Source for og-image.png (1200x630). Regenerate with scripts/render-images.sh -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #faf8fd; font-family: 'Plus Jakarta Sans', sans-serif; color: #16132a; }
  .bar-top { height: 14px; background: linear-gradient(90deg, #ffbe0b, #fb5607, #ff006e, #8338ec, #3a86ff); }
  .wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; padding: 70px 80px 0; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 34px; margin-bottom: 40px; }
  h1 { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 76px; line-height: 1.02; letter-spacing: -.02em; }
  p { font-size: 27px; font-weight: 300; color: #5d5873; margin-top: 26px; line-height: 1.4; }
  .card { background: #fff; border-radius: 28px; padding: 38px; box-shadow: 0 20px 60px rgb(22 19 42 / 14%); transform: rotate(1.5deg); }
  .t { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 30px; }
  .s { color: #5d5873; font-size: 21px; margin-top: 4px; }
  .bar { position: relative; height: 26px; background: #f1eef7; border-radius: 99px; overflow: hidden; margin: 26px 0 18px; }
  .fill { position: absolute; inset: 0 38% 0 0; background: #8338ec; border-radius: 99px 0 0 99px; }
  .plan { position: absolute; top: 0; bottom: 0; left: 62%; width: 22%; background: repeating-linear-gradient(135deg, #9ec5ff 0 9px, transparent 9px 15px); }
  .row { display: flex; align-items: center; gap: 14px; font-size: 23px; padding: 14px 0; border-top: 1px solid #e4e0ee; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid #d3cde3; }
  .dot.done { background: #8338ec; border-color: #8338ec; }
  .row b { margin-left: auto; font-weight: 600; }
  .sale { white-space: nowrap; margin-left: auto; background: #e3eeff; color: #1a5fd0; font-weight: 700; font-size: 17px; padding: 4px 12px; border-radius: 99px; }
</style>
</head>
<body>
  <div class="bar-top"></div>
  <div class="wrap">
    <div>
      <div class="brand"><img src="../icon.svg" width="48" height="48" alt="">Gift Budget</div>
      <h1>Give generously. Stay on budget.</h1>
      <p>Plan gifts for every occasion, budget per event or per person, and catch the sales.</p>
    </div>
    <div class="card">
      <div class="t">Hanukkah 2026</div>
      <div class="s">$186 spent of $300 · $114 left</div>
      <div class="bar"><div class="fill"></div><div class="plan"></div></div>
      <div class="row"><span class="dot done"></span>Cookbook for Ari<b>$42.00</b></div>
      <div class="row"><span class="dot"></span>Wireless headphones<span class="sale">Sale −20%</span></div>
      <div class="row"><span class="dot"></span>Dreidel puzzle set<b>$24.99</b></div>
    </div>
  </div>
</body>
</html>
