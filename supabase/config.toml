# Only the settings this project relies on. Run `supabase init` / `supabase link`
# to generate the rest if you want a full local stack.
project_id = "gift-budget"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.check-prices]
# The function checks the user's JWT itself, and also accepts the cron secret.
verify_jwt = false
